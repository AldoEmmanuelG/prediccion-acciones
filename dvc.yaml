# Pipeline de entrenamiento. `dvc repro` lo corre solo si cambiaron los datos,
# la configuracion o el codigo; si nada cambio, reutiliza lo que ya esta en cache.
stages:
  entrenar:
    cmd: python -m prediccion_acciones.entrenamiento
    deps:
      - data/raw
      - configs/config.yaml
      - src/prediccion_acciones
    outs:
      - models/logistica.joblib
      - models/boosting.joblib
      - models/pytorch.pt
      - models/metricas.json
      - models/prueba_adelante.csv
      - models/precios_app.csv
