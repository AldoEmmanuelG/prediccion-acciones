[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prediccion-acciones"
version = "0.1.0"
description = "Pipeline de ML de punta a punta: prediccion de la direccion diaria de acciones, servido con Streamlit y Docker."
readme = "README.md"
# Rango cerrado en 3.12: uv elige solo esa version, sin necesidad de .python-version.
requires-python = ">=3.12,<3.13"

# Dependencias que necesita la APP en produccion (lo que entra a la imagen de Docker).
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.4,<2",
    "torch>=2.2,<3",
    "yfinance>=0.2.40,<1",
    "pandera[pandas]>=0.20,<1",
    "matplotlib>=3.8,<4",
    "streamlit>=1.35,<2",
    "joblib>=1.3,<2",
    "pyyaml>=6,<7",
    "python-dotenv>=1,<2",
]

# Grupos solo para trabajar en el proyecto: NO entran a la imagen de Docker.
[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<7",
    "ruff>=0.16,<1",
    "pre-commit>=3.7,<5",
]
tracking = [
    "mlflow>=2.14,<4",
    "dvc>=3.50,<4",
]

[tool.uv]
# `uv sync` instala ambos grupos por defecto en tu computadora.
default-groups = ["dev", "tracking"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F: errores y pyflakes | I: orden de imports | UP: sintaxis moderna de Python
# B: errores comunes (bugbear) | SIM: simplificaciones | T20: prohibe print()
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]

[tool.ruff.lint.isort]
known-first-party = ["prediccion_acciones"]

[tool.ruff.lint.per-file-ignores]
# Los notebooks si pueden usar print y no tienen que ordenar imports al inicio.
"notebooks/**" = ["T20", "E402"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["src"]
